<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AXI4 VIP checking and coverage flow</title>
  <desc id="desc">Both-side monitor streams feed the scoreboard and agent-local functional coverage. Selected manager streams feed environment coverage, and manager AW, B, AR and R feed metrics. Common necessary gates combine metrics, final UVM counts and completion, while each test also needs scenario-specific evidence.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#059669"/></marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ea580c"/></marker>
    <style>
      text{font-family:Inter,"DejaVu Sans",Arial,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.h{font-size:14px;font-weight:700}.t{font-size:11px}.s{font-size:10px;fill:#536173}.source{fill:#e9fbf4;stroke:#059669;stroke-width:1.4}.score{fill:#eefbf5;stroke:#047857;stroke-width:1.7}.ref{fill:#f4edff;stroke:#7c3aed;stroke-width:1.5}.cov{fill:#fff7ed;stroke:#ea580c;stroke-width:1.4}.sva{fill:#fff1f2;stroke:#dc2626;stroke-width:1.4}.verdict{fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}.flow{fill:none;stroke:#059669;stroke-width:2;marker-end:url(#a)}.rflow{fill:none;stroke:#7c3aed;stroke-width:1.8;stroke-dasharray:5 4;marker-end:url(#p)}.oflow{fill:none;stroke:#ea580c;stroke-width:1.8;marker-end:url(#o)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text class="title" x="40" y="42">Checking, coverage, and qualification evidence</text>
  <text class="s" x="40" y="62">Analysis streams are independent of pin-level SVA. A qualified pass combines multiple evidence sources.</text>

  <rect class="source" x="40" y="104" width="235" height="122" rx="9"/>
  <text class="h" x="157" y="132" text-anchor="middle">Manager monitors</text>
  <text class="t" x="157" y="158" text-anchor="middle">AW · W · B · AR · R</text>
  <text class="s" x="157" y="183" text-anchor="middle">five analysis ports</text>
  <text class="s" x="157" y="201" text-anchor="middle">observed before/directly at DUT</text>

  <rect class="source" x="40" y="270" width="235" height="122" rx="9"/>
  <text class="h" x="157" y="298" text-anchor="middle">Subordinate monitors</text>
  <text class="t" x="157" y="324" text-anchor="middle">AW · W · B · AR · R</text>
  <text class="s" x="157" y="349" text-anchor="middle">five analysis ports</text>
  <text class="s" x="157" y="367" text-anchor="middle">observed after/directly at DUT</text>

  <rect class="ref" x="40" y="442" width="235" height="142" rx="9"/>
  <text class="h" x="157" y="470" text-anchor="middle">Reference model / oracle</text>
  <text class="t" x="157" y="495" text-anchor="middle">address decode</text>
  <text class="t" x="157" y="516" text-anchor="middle">manager + AxPROT permission</text>
  <text class="t" x="157" y="537" text-anchor="middle">expected response</text>
  <text class="t" x="157" y="558" text-anchor="middle">byte-addressable memory</text>

  <rect class="score" x="358" y="104" width="340" height="288" rx="10"/>
  <text class="h" x="528" y="133" text-anchor="middle">axi4_scoreboard</text>
  <text class="t" x="382" y="165">1. Pair manager ↔ subordinate</text>
  <text class="s" x="400" y="184">arrival order (direct) or keyed tuple (fabric)</text>
  <text class="t" x="382" y="213">2. Compare channel fields and responses</text>
  <text class="t" x="382" y="242">3. Track IDs, outstanding, and expected data</text>
  <text class="t" x="382" y="271">4. Apply reset-aware state handling</text>
  <text class="t" x="382" y="300">5. End-of-test completeness gate</text>
  <text class="s" x="400" y="321">FIFO residue · inflight · unmatched pools</text>
  <text class="s" x="400" y="340">unanswered IDs · holding pools · pipeline</text>
  <text class="s" x="528" y="373" text-anchor="middle">UVM errors/fatals contribute to final counts</text>

  <path class="flow" d="M275 165H358"/><path class="flow" d="M275 331H358"/>
  <path class="rflow" d="M275 513C322 513 322 348 358 348"/>

  <rect class="cov" x="758" y="104" width="202" height="126" rx="9"/>
  <text class="h" x="859" y="132" text-anchor="middle">Functional coverage</text>
  <text class="t" x="859" y="158" text-anchor="middle">both sides: agent groups</text>
  <text class="t" x="859" y="179" text-anchor="middle">manager selected: protocol/error</text>
  <text class="t" x="859" y="200" text-anchor="middle">QoS/USER · exclusive · crosses</text>

  <rect class="cov" x="758" y="266" width="202" height="126" rx="9"/>
  <text class="h" x="859" y="294" text-anchor="middle">Performance metrics</text>
  <text class="t" x="859" y="320" text-anchor="middle">manager AW/B/AR/R only</text>
  <text class="t" x="859" y="341" text-anchor="middle">fairness · dead/livelock</text>
  <text class="t" x="859" y="367" text-anchor="middle">TEST RESULT: PASS | FAIL</text>

  <path class="oflow" d="M275 185V82H724V167H758"/>
  <path class="oflow" d="M275 350V414H724V200H758"/>
  <path class="oflow" d="M275 165H318V428H738V329H758"/>

  <rect class="sva" x="358" y="442" width="340" height="142" rx="9"/>
  <text class="h" x="528" y="470" text-anchor="middle">Bound targeted SVA</text>
  <text class="t" x="528" y="496" text-anchor="middle">stable while stalled · known while VALID</text>
  <text class="t" x="528" y="518" text-anchor="middle">VALID held until READY · eventual READY</text>
  <text class="t" x="528" y="540" text-anchor="middle">selected X injection/recovery paths</text>
  <text class="s" x="528" y="566" text-anchor="middle">observes pins; not a complete compliance checker</text>

  <rect class="verdict" x="1003" y="176" width="165" height="298" rx="11"/>
  <text class="h" x="1085" y="205" text-anchor="middle">Common gates</text>
  <rect x="1022" y="232" width="127" height="50" rx="6" fill="#fff" stroke="#2563eb"/>
  <text class="t" x="1085" y="253" text-anchor="middle">TEST RESULT</text><text class="h" x="1085" y="272" text-anchor="middle">PASS</text>
  <text class="h" x="1085" y="307" text-anchor="middle">+</text>
  <rect x="1022" y="324" width="127" height="60" rx="6" fill="#fff" stroke="#2563eb"/>
  <text class="t" x="1085" y="346" text-anchor="middle">UVM_ERROR 0</text><text class="t" x="1085" y="369" text-anchor="middle">UVM_FATAL 0</text>
  <text class="h" x="1085" y="408" text-anchor="middle">+</text>
  <rect x="1022" y="425" width="127" height="32" rx="6" fill="#fff" stroke="#2563eb"/>
  <text class="t" x="1085" y="446" text-anchor="middle">confirmed end</text>

  <path class="flow" d="M698 248H724V414H980V354H1003"/>
  <path class="oflow" d="M960 329H1003"/>
  <path d="M698 513C916 513 941 443 1003 443" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#o)"/>
  <text class="s" x="1003" y="516" text-anchor="end">Necessary, not sufficient: also prove scenario intent</text>
</svg>
