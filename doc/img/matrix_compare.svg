<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <style>
    .ttl  { font-size: 16px; font-weight: bold; fill: #102a43; }
    .sub  { font-size: 11px; fill: #52606d; }
    .hd   { font-size: 11px; font-weight: bold; fill: #243b53; }
    .cell { font-size: 11px; fill: #243b53; }
    .grid { fill: #ffffff; stroke: #bcccdc; stroke-width: 1; }
    .hdr  { fill: #e4ebf2; stroke: #9fb3c8; stroke-width: 1; }
    .rw   { fill: #d5efdc; stroke: #4a9463; stroke-width: 1; }
    .ro   { fill: #dbe8f7; stroke: #3d7fb5; stroke-width: 1; }
    .wo   { fill: #fdeacd; stroke: #c99b2e; stroke-width: 1; }
    .no   { fill: #f7d9dd; stroke: #b5566b; stroke-width: 1; }
    .cond { fill: #e8e0f5; stroke: #7a5bb0; stroke-width: 1; }
    .panel{ fill: none; stroke: #9aa5b1; stroke-width: 1.4; stroke-dasharray: 6 4; }
  </style>

  <!-- ===== BASE 4x4 ===== -->
  <rect class="panel" x="14" y="14" width="440" height="330" rx="8"/>
  <text class="ttl" x="34" y="40">BASE_BUS_MATRIX — 4 masters × 4 slaves</text>
  <text class="sub" x="34" y="58">+BUS_MATRIX_MODE=4x4 · reference: bm/axi4_bus_matrix_ref.sv::configure_base_matrix()</text>

  <rect class="hdr" x="34" y="72" width="150" height="26"/>
  <text class="hd" x="42" y="90">slave / region</text>
  <rect class="hdr" x="184" y="72" width="60" height="26"/><text class="hd" x="214" y="90" text-anchor="middle">M0</text>
  <rect class="hdr" x="244" y="72" width="60" height="26"/><text class="hd" x="274" y="90" text-anchor="middle">M1</text>
  <rect class="hdr" x="304" y="72" width="60" height="26"/><text class="hd" x="334" y="90" text-anchor="middle">M2</text>
  <rect class="hdr" x="364" y="72" width="60" height="26"/><text class="hd" x="394" y="90" text-anchor="middle">M3</text>

  <rect class="grid" x="34" y="98" width="150" height="40"/>
  <text class="cell" x="42" y="114">S0 DDR Memory</text><text class="sub" x="42" y="130">0x100_0000_0000 · 32 GiB</text>
  <rect class="rw" x="184" y="98" width="60" height="40"/><text class="cell" x="214" y="122" text-anchor="middle">R/W</text>
  <rect class="rw" x="244" y="98" width="60" height="40"/><text class="cell" x="274" y="122" text-anchor="middle">R/W</text>
  <rect class="rw" x="304" y="98" width="60" height="40"/><text class="cell" x="334" y="122" text-anchor="middle">R/W</text>
  <rect class="rw" x="364" y="98" width="60" height="40"/><text class="cell" x="394" y="122" text-anchor="middle">R/W</text>

  <rect class="grid" x="34" y="138" width="150" height="40"/>
  <text class="cell" x="42" y="154">S1 Boot ROM</text><text class="sub" x="42" y="170">0x0000_0000_0000 · 128 KiB</text>
  <rect class="ro" x="184" y="138" width="60" height="40"/><text class="cell" x="214" y="162" text-anchor="middle">R</text>
  <rect class="ro" x="244" y="138" width="60" height="40"/><text class="cell" x="274" y="162" text-anchor="middle">R</text>
  <rect class="ro" x="304" y="138" width="60" height="40"/><text class="cell" x="334" y="162" text-anchor="middle">R</text>
  <rect class="ro" x="364" y="138" width="60" height="40"/><text class="cell" x="394" y="162" text-anchor="middle">R</text>

  <rect class="grid" x="34" y="178" width="150" height="40"/>
  <text class="cell" x="42" y="194">S2 Peripheral Regs</text><text class="sub" x="42" y="210">0x010_0000_0000 · 1 MiB</text>
  <rect class="rw" x="184" y="178" width="60" height="40"/><text class="cell" x="214" y="202" text-anchor="middle">R/W</text>
  <rect class="rw" x="244" y="178" width="60" height="40"/><text class="cell" x="274" y="202" text-anchor="middle">R/W</text>
  <rect class="rw" x="304" y="178" width="60" height="40"/><text class="cell" x="334" y="202" text-anchor="middle">R/W</text>
  <rect class="no" x="364" y="178" width="60" height="40"/><text class="cell" x="394" y="202" text-anchor="middle">—</text>

  <rect class="grid" x="34" y="218" width="150" height="40"/>
  <text class="cell" x="42" y="234">S3 HW Fuse Box</text><text class="sub" x="42" y="250">0x020_0000_0000 · 4 KiB</text>
  <rect class="ro" x="184" y="218" width="60" height="40"/><text class="cell" x="214" y="242" text-anchor="middle">R</text>
  <rect class="no" x="244" y="218" width="60" height="40"/><text class="cell" x="274" y="242" text-anchor="middle">—</text>
  <rect class="no" x="304" y="218" width="60" height="40"/><text class="cell" x="334" y="242" text-anchor="middle">—</text>
  <rect class="ro" x="364" y="218" width="60" height="40"/><text class="cell" x="394" y="242" text-anchor="middle">R</text>

  <text class="sub" x="34" y="284">Permission is a plain per-master read/write mask.</text>
  <text class="sub" x="34" y="300">No security, privilege or instruction-fetch qualifier is applied.</text>
  <text class="sub" x="34" y="316">Anything outside these four regions decodes to DECERR.</text>

  <!-- ===== ENHANCED 10x10 ===== -->
  <rect class="panel" x="470" y="14" width="496" height="592" rx="8"/>
  <text class="ttl" x="490" y="40">BUS_ENHANCED_MATRIX — 10 masters × 10 slaves</text>
  <text class="sub" x="490" y="58">+BUS_MATRIX_MODE=ENHANCED · configure_enhanced_matrix() · spec: claude.md</text>

  <rect class="hdr" x="490" y="72" width="196" height="26"/>
  <text class="hd" x="498" y="90">slave / region</text>
  <rect class="hdr" x="686" y="72" width="130" height="26"/><text class="hd" x="751" y="90" text-anchor="middle">M0..M9</text>
  <rect class="hdr" x="816" y="72" width="130" height="26"/><text class="hd" x="881" y="90" text-anchor="middle">extra qualifier</text>

  <rect class="grid" x="490" y="98" width="196" height="38"/>
  <text class="cell" x="498" y="114">S0 DDR Secure Kernel</text><text class="sub" x="498" y="129">0x8_0000_0000 · 1 GiB</text>
  <rect class="rw" x="686" y="98" width="130" height="38"/><text class="cell" x="751" y="121" text-anchor="middle">R/W</text>
  <rect class="cond" x="816" y="98" width="130" height="38"/><text class="cell" x="881" y="121" text-anchor="middle">AxPROT secure only</text>

  <rect class="grid" x="490" y="136" width="196" height="38"/>
  <text class="cell" x="498" y="152">S1 DDR Non-Secure User</text><text class="sub" x="498" y="167">0x8_4000_0000 · 1 GiB</text>
  <rect class="rw" x="686" y="136" width="130" height="38"/><text class="cell" x="751" y="159" text-anchor="middle">R/W</text>
  <rect class="grid" x="816" y="136" width="130" height="38"/><text class="sub" x="881" y="159" text-anchor="middle">none</text>

  <rect class="grid" x="490" y="174" width="196" height="38"/>
  <text class="cell" x="498" y="190">S2 DDR Shared Buffer</text><text class="sub" x="498" y="205">0x8_8000_0000 · 1 GiB</text>
  <rect class="rw" x="686" y="174" width="130" height="38"/><text class="cell" x="751" y="197" text-anchor="middle">R/W</text>
  <rect class="grid" x="816" y="174" width="130" height="38"/><text class="sub" x="881" y="197" text-anchor="middle">none</text>

  <rect class="grid" x="490" y="212" width="196" height="38"/>
  <text class="cell" x="498" y="228">S3 Illegal Address Hole</text><text class="sub" x="498" y="243">0x8_C000_0000 · 1 GiB</text>
  <rect class="no" x="686" y="212" width="130" height="38"/><text class="cell" x="751" y="235" text-anchor="middle">no access</text>
  <rect class="cond" x="816" y="212" width="130" height="38"/><text class="cell" x="881" y="235" text-anchor="middle">always DECERR</text>

  <rect class="grid" x="490" y="250" width="196" height="38"/>
  <text class="cell" x="498" y="266">S4 XOM Instruction-Only</text><text class="sub" x="498" y="281">0x9_0000_0000 · 1 GiB</text>
  <rect class="ro" x="686" y="250" width="130" height="38"/><text class="cell" x="751" y="273" text-anchor="middle">R</text>
  <rect class="cond" x="816" y="250" width="130" height="38"/><text class="cell" x="881" y="273" text-anchor="middle">instruction fetch only</text>

  <rect class="grid" x="490" y="288" width="196" height="38"/>
  <text class="cell" x="498" y="304">S5 RO Peripheral</text><text class="sub" x="498" y="319">0xA_0000_0000 · 64 KiB</text>
  <rect class="ro" x="686" y="288" width="130" height="38"/><text class="cell" x="751" y="311" text-anchor="middle">R</text>
  <rect class="grid" x="816" y="288" width="130" height="38"/><text class="sub" x="881" y="311" text-anchor="middle">write → SLVERR</text>

  <rect class="grid" x="490" y="326" width="196" height="38"/>
  <text class="cell" x="498" y="342">S6 Privileged-Only</text><text class="sub" x="498" y="357">0xA_0001_0000 · 64 KiB</text>
  <rect class="rw" x="686" y="326" width="130" height="38"/><text class="cell" x="751" y="349" text-anchor="middle">R/W</text>
  <rect class="cond" x="816" y="326" width="130" height="38"/><text class="cell" x="881" y="349" text-anchor="middle">AxPROT privileged</text>

  <rect class="grid" x="490" y="364" width="196" height="38"/>
  <text class="cell" x="498" y="380">S7 Secure-Only</text><text class="sub" x="498" y="395">0xA_0002_0000 · 64 KiB</text>
  <rect class="rw" x="686" y="364" width="130" height="38"/><text class="cell" x="751" y="387" text-anchor="middle">R/W</text>
  <rect class="cond" x="816" y="364" width="130" height="38"/><text class="cell" x="881" y="387" text-anchor="middle">AxPROT secure</text>

  <rect class="grid" x="490" y="402" width="196" height="38"/>
  <text class="cell" x="498" y="418">S8 Scratchpad</text><text class="sub" x="498" y="433">0xA_0003_0000 · 64 KiB</text>
  <rect class="rw" x="686" y="402" width="130" height="38"/><text class="cell" x="751" y="425" text-anchor="middle">R/W</text>
  <rect class="grid" x="816" y="402" width="130" height="38"/><text class="sub" x="881" y="425" text-anchor="middle">none</text>

  <rect class="grid" x="490" y="440" width="196" height="38"/>
  <text class="cell" x="498" y="456">S9 Attribute Monitor</text><text class="sub" x="498" y="471">0xA_0004_0000 · 64 KiB</text>
  <rect class="wo" x="686" y="440" width="130" height="38"/><text class="cell" x="751" y="463" text-anchor="middle">W only</text>
  <rect class="cond" x="816" y="440" width="130" height="38"/><text class="cell" x="881" y="463" text-anchor="middle">read → SLVERR</text>

  <text class="sub" x="490" y="504">The read/write masks are all-ones for most regions; the access decision is made by</text>
  <text class="sub" x="490" y="520">the QUALIFIER column — check_security_access(), check_privilege_access() and</text>
  <text class="sub" x="490" y="536">check_instruction_access() evaluate AxPROT, so the same address legitimately returns</text>
  <text class="sub" x="490" y="552">OKAY or SLVERR depending on the transaction's protection attributes.</text>
  <text class="sub" x="490" y="574">This is why the scoreboard must be given the transaction's real AxPROT: hard-coding</text>
  <text class="sub" x="490" y="590">ARPROT to 3'b000 silently disabled every security check above.</text>

  <!-- legend -->
  <rect class="rw" x="34" y="360" width="18" height="14"/><text class="sub" x="58" y="372">read + write permitted</text>
  <rect class="ro" x="34" y="382" width="18" height="14"/><text class="sub" x="58" y="394">read only</text>
  <rect class="wo" x="34" y="404" width="18" height="14"/><text class="sub" x="58" y="416">write only</text>
  <rect class="no" x="34" y="426" width="18" height="14"/><text class="sub" x="58" y="438">no access</text>
  <rect class="cond" x="34" y="448" width="18" height="14"/><text class="sub" x="58" y="460">conditional on AxPROT</text>

  <text class="ttl" x="34" y="500">NONE</text>
  <text class="sub" x="34" y="518">No reference model. decode() returns slave 0 for every address and every</text>
  <text class="sub" x="34" y="534">response is OKAY, so a test bound to NONE cannot fail an access check.</text>
  <text class="sub" x="34" y="556">Track-B tests therefore bind their topology from the compiled fabric and</text>
  <text class="sub" x="34" y="572">uvm_fatal on a contradicting +BUS_MATRIX_MODE, rather than defaulting here.</text>
</svg>
