<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <style>
    .lbl   { font-size: 13px; fill: #1f2933; }
    .sub   { font-size: 11px; fill: #52606d; }
    .ttl   { font-size: 15px; font-weight: bold; fill: #102a43; }
    .lyr   { font-size: 12px; font-weight: bold; fill: #486581; letter-spacing: 1px; }
    .box   { fill: #f0f4f8; stroke: #829ab1; stroke-width: 1.2; }
    .agent { fill: #d9e8f6; stroke: #3d7fb5; stroke-width: 1.2; }
    .chk   { fill: #dff0e4; stroke: #4a9463; stroke-width: 1.2; }
    .cov   { fill: #fdf0d5; stroke: #c99b2e; stroke-width: 1.2; }
    .dut   { fill: #f5dfe2; stroke: #b5566b; stroke-width: 1.2; }
    .lyrbox{ fill: none; stroke: #9aa5b1; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .flow  { stroke: #3d7fb5; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .pin   { stroke: #b5566b; stroke-width: 1.4; fill: none; marker-end: url(#r); }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#3d7fb5"/>
    </marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b5566b"/>
    </marker>
  </defs>

  <!-- ================= HVL layer ================= -->
  <rect class="lyrbox" x="16" y="16" width="928" height="330" rx="8"/>
  <text class="lyr" x="30" y="38">HVL — hvl_top (class-based UVM)</text>

  <rect class="box" x="40" y="52" width="150" height="40" rx="4"/>
  <text class="ttl" x="115" y="70" text-anchor="middle">uvm_test</text>
  <text class="sub" x="115" y="85" text-anchor="middle">+UVM_TESTNAME</text>

  <rect class="box" x="40" y="108" width="880" height="222" rx="6"/>
  <text class="ttl" x="58" y="128">axi4_env</text>

  <!-- master agents -->
  <rect class="agent" x="58" y="142" width="196" height="86" rx="4"/>
  <text class="ttl" x="156" y="160" text-anchor="middle">axi4_master_agent [0..N-1]</text>
  <text class="lbl" x="156" y="178" text-anchor="middle">sequencer / driver_proxy</text>
  <text class="lbl" x="156" y="194" text-anchor="middle">monitor_proxy</text>
  <text class="sub" x="156" y="212" text-anchor="middle">tx ⇄ struct via seq_item_converter</text>

  <!-- slave agents -->
  <rect class="agent" x="58" y="238" width="196" height="80" rx="4"/>
  <text class="ttl" x="156" y="256" text-anchor="middle">axi4_slave_agent [0..N-1]</text>
  <text class="lbl" x="156" y="274" text-anchor="middle">driver_proxy + slave_memory</text>
  <text class="lbl" x="156" y="290" text-anchor="middle">monitor_proxy</text>
  <text class="sub" x="156" y="308" text-anchor="middle">SLAVE_MEM_MODE (default)</text>

  <!-- reference model -->
  <rect class="chk" x="278" y="142" width="184" height="86" rx="4"/>
  <text class="ttl" x="370" y="160" text-anchor="middle">axi4_bus_matrix_ref</text>
  <text class="lbl" x="370" y="178" text-anchor="middle">decode() → slave index</text>
  <text class="lbl" x="370" y="194" text-anchor="middle">get_write_resp / get_read_resp</text>
  <text class="sub" x="370" y="212" text-anchor="middle">NONE | BASE 4×4 | ENHANCED 10×10</text>

  <!-- scoreboard -->
  <rect class="chk" x="278" y="238" width="184" height="80" rx="4"/>
  <text class="ttl" x="370" y="256" text-anchor="middle">axi4_scoreboard</text>
  <text class="lbl" x="370" y="274" text-anchor="middle">keyed master↔slave pairing</text>
  <text class="lbl" x="370" y="290" text-anchor="middle">C1–C6 completeness checks</text>
  <text class="sub" x="370" y="308" text-anchor="middle">reset-aware (state discarded)</text>

  <!-- coverage -->
  <rect class="cov" x="486" y="142" width="200" height="86" rx="4"/>
  <text class="ttl" x="586" y="160" text-anchor="middle">functional coverage</text>
  <text class="lbl" x="586" y="178" text-anchor="middle">master / slave per-channel cg</text>
  <text class="lbl" x="586" y="194" text-anchor="middle">qos_user · protocol · error_inj</text>
  <text class="sub" x="586" y="212" text-anchor="middle">one analysis imp per AXI channel</text>

  <!-- perf -->
  <rect class="cov" x="486" y="238" width="200" height="80" rx="4"/>
  <text class="ttl" x="586" y="256" text-anchor="middle">axi4_performance_metrics</text>
  <text class="lbl" x="586" y="274" text-anchor="middle">throughput / latency / fairness</text>
  <text class="sub" x="586" y="292" text-anchor="middle">emits TEST RESULT: PASS|FAIL</text>
  <text class="sub" x="586" y="308" text-anchor="middle">consumes deadlock + livelock flags</text>

  <!-- checkers -->
  <rect class="chk" x="710" y="142" width="192" height="86" rx="4"/>
  <text class="ttl" x="806" y="160" text-anchor="middle">reset / freq checkers</text>
  <text class="lbl" x="806" y="178" text-anchor="middle">axi4_reset_checker</text>
  <text class="lbl" x="806" y="194" text-anchor="middle">axi4_freq_checker</text>
  <text class="sub" x="806" y="212" text-anchor="middle">independent per-interface clk/rst</text>

  <rect class="box" x="710" y="238" width="192" height="80" rx="4"/>
  <text class="ttl" x="806" y="256" text-anchor="middle">virtual sequencer</text>
  <text class="lbl" x="806" y="274" text-anchor="middle">virtual_seq/ (137 files)</text>
  <text class="sub" x="806" y="292" text-anchor="middle">coordinates all master/slave</text>
  <text class="sub" x="806" y="308" text-anchor="middle">sequencers for one scenario</text>

  <path class="flow" d="M115,92 L115,108"/>

  <!-- ================= HDL layer ================= -->
  <rect class="lyrbox" x="16" y="362" width="928" height="256" rx="8"/>
  <text class="lyr" x="30" y="384">HDL — hdl_top (interfaces, BFMs, DUT)</text>

  <rect class="agent" x="58" y="398" width="196" height="74" rx="4"/>
  <text class="ttl" x="156" y="416" text-anchor="middle">master_agent_bfm ×N</text>
  <text class="lbl" x="156" y="434" text-anchor="middle">driver_bfm · monitor_bfm</text>
  <text class="sub" x="156" y="452" text-anchor="middle">standing B/R collectors</text>
  <text class="sub" x="156" y="466" text-anchor="middle">per-RID read accumulator</text>

  <rect class="agent" x="58" y="486" width="196" height="66" rx="4"/>
  <text class="ttl" x="156" y="504" text-anchor="middle">slave_agent_bfm ×N</text>
  <text class="lbl" x="156" y="522" text-anchor="middle">driver_bfm · monitor_bfm</text>
  <text class="sub" x="156" y="540" text-anchor="middle">holds VALID until handshake</text>

  <rect class="box" x="292" y="398" width="150" height="154" rx="4"/>
  <text class="ttl" x="367" y="418" text-anchor="middle">axi4_if</text>
  <text class="lbl" x="367" y="440" text-anchor="middle">master_if_gen[i]</text>
  <text class="lbl" x="367" y="458" text-anchor="middle">slave_if_gen[i]</text>
  <text class="sub" x="367" y="482" text-anchor="middle">AW W B AR R</text>
  <text class="sub" x="367" y="500" text-anchor="middle">ADDRESS_WIDTH</text>
  <text class="sub" x="367" y="516" text-anchor="middle">DATA_WIDTH</text>
  <text class="sub" x="367" y="532" text-anchor="middle">`AXI_ID_WIDTH</text>

  <text class="lyr" x="486" y="418">DUT under test — selected at COMPILE time</text>

  <rect class="dut" x="486" y="430" width="200" height="56" rx="4"/>
  <text class="ttl" x="586" y="450" text-anchor="middle">direct 1:1 wiring</text>
  <text class="sub" x="586" y="468" text-anchor="middle">sim/axi4_compile.f</text>
  <text class="sub" x="586" y="480" text-anchor="middle">no interconnect — VIP vs VIP</text>

  <rect class="dut" x="486" y="494" width="200" height="58" rx="4"/>
  <text class="ttl" x="586" y="514" text-anchor="middle">commercial fabric IP</text>
  <text class="sub" x="586" y="532" text-anchor="middle">project-authored fabric wrapper</text>
  <text class="sub" x="586" y="546" text-anchor="middle">licensed RTL under ext/ — local only</text>

  <rect class="box" x="710" y="430" width="192" height="122" rx="4"/>
  <text class="ttl" x="806" y="450" text-anchor="middle">assertions</text>
  <text class="lbl" x="806" y="470" text-anchor="middle">master_assertions.sv</text>
  <text class="lbl" x="806" y="488" text-anchor="middle">slave_assertions.sv</text>
  <text class="sub" x="806" y="510" text-anchor="middle">A3.2.1 VALID-stable ×5/side</text>
  <text class="sub" x="806" y="526" text-anchor="middle">X-injection cover properties</text>
  <text class="sub" x="806" y="542" text-anchor="middle">READY-within-limit liveness</text>

  <path class="pin" d="M254,435 L292,435"/>
  <path class="pin" d="M254,519 L292,510"/>
  <path class="pin" d="M442,460 L486,458"/>
  <path class="pin" d="M442,500 L486,520"/>

  <path class="flow" d="M156,330 L156,398" stroke-dasharray="4 3"/>
  <text class="sub" x="166" y="356">virtual interface bind</text>
</svg>
