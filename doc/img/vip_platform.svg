<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">tim_axi4_vip platform architecture</title>
  <desc id="desc">The UVM test and agent proxies in the HVL layer communicate through converter structs and virtual BFM interfaces with AXI BFMs and pins in the HDL layer. Both-side monitors feed checking and coverage.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#dc2626"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#059669"/></marker>
    <style>
      text{font-family:Inter,"DejaVu Sans",Arial,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.layer{font-size:15px;font-weight:700;letter-spacing:1px}.h{font-size:14px;font-weight:700}.t{font-size:12px}.s{font-size:10px;fill:#526174}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.control{fill:#eaf2ff;stroke:#2563eb;stroke-width:1.4}.analysis{fill:#e9fbf4;stroke:#059669;stroke-width:1.4}.reference{fill:#f4edff;stroke:#7c3aed;stroke-width:1.4}.pinbox{fill:#fff1f2;stroke:#dc2626;stroke-width:1.4}.optional{fill:#f8fafc;stroke:#64748b;stroke-width:1.3;stroke-dasharray:6 4}.ctrl{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#blueArrow)}.pins{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#redArrow)}.ana{fill:none;stroke:#059669;stroke-width:2;marker-end:url(#greenArrow)}.config{fill:none;stroke:#7c3aed;stroke-width:1.6;stroke-dasharray:5 4}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#blueArrow)}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="40" y="38">AXI4 VIP platform — active data and checking paths</text>
  <text class="s" x="40" y="58">Blue: sequence/control · Red: pin-level AXI · Green: analysis · Purple dashed: configuration/reference · Gray dashed: optional</text>

  <rect class="panel" x="28" y="76" width="1144" height="355" rx="12"/>
  <text class="layer" x="46" y="101">HVL / UVM — top/hvl_top.sv</text>

  <rect class="control" x="48" y="122" width="150" height="62" rx="8"/>
  <text class="h" x="123" y="146" text-anchor="middle">UVM test</text>
  <text class="t" x="123" y="166" text-anchor="middle">test config + objections</text>

  <rect class="control" x="230" y="122" width="170" height="62" rx="8"/>
  <text class="h" x="315" y="146" text-anchor="middle">Virtual sequence</text>
  <text class="t" x="315" y="166" text-anchor="middle">multi-port scenario</text>

  <rect class="control" x="432" y="122" width="180" height="62" rx="8"/>
  <text class="h" x="522" y="146" text-anchor="middle">Virtual sequencer</text>
  <text class="t" x="522" y="166" text-anchor="middle">M/S read + write arrays</text>

  <path class="ctrl" d="M198 153H230"/><path class="ctrl" d="M400 153H432"/>

  <rect class="control" x="48" y="221" width="250" height="116" rx="8"/>
  <text class="h" x="173" y="246" text-anchor="middle">Manager agent [0..M−1]</text>
  <text class="t" x="173" y="269" text-anchor="middle">write sequencer · read sequencer</text>
  <text class="t" x="173" y="290" text-anchor="middle">driver proxy → converter</text>
  <text class="t" x="173" y="311" text-anchor="middle">monitor proxy ← five channel streams</text>
  <text class="s" x="173" y="328" text-anchor="middle">driver/sequencers only when active</text>

  <rect class="control" x="330" y="221" width="250" height="116" rx="8"/>
  <text class="h" x="455" y="246" text-anchor="middle">Subordinate agent [0..S−1]</text>
  <text class="t" x="455" y="269" text-anchor="middle">reactive memory mode (default)</text>
  <text class="t" x="455" y="290" text-anchor="middle">driver proxy → converter</text>
  <text class="t" x="455" y="311" text-anchor="middle">monitor proxy ← five channel streams</text>
  <text class="s" x="455" y="328" text-anchor="middle">sequence-driven response use is optional</text>

  <path class="ctrl" d="M476 184V201H173V221"/><path class="dash" d="M568 184V201H455V221"/>

  <rect class="reference" x="628" y="122" width="202" height="84" rx="8"/>
  <text class="h" x="729" y="147" text-anchor="middle">Bus-matrix reference</text>
  <text class="t" x="729" y="168" text-anchor="middle">decode · permission · response</text>
  <text class="t" x="729" y="188" text-anchor="middle">per-subordinate byte memory</text>

  <rect class="analysis" x="862" y="122" width="270" height="84" rx="8"/>
  <text class="h" x="997" y="147" text-anchor="middle">Scoreboard</text>
  <text class="t" x="997" y="168" text-anchor="middle">10 channel FIFOs · pairing · IDs</text>
  <text class="t" x="997" y="188" text-anchor="middle">expected data · end completeness</text>

  <rect class="analysis" x="628" y="238" width="202" height="99" rx="8"/>
  <text class="h" x="729" y="263" text-anchor="middle">Analysis consumers</text>
  <text class="t" x="729" y="284" text-anchor="middle">both sides: agent coverage</text>
  <text class="t" x="729" y="304" text-anchor="middle">manager selected: protocol/error</text>
  <text class="t" x="729" y="324" text-anchor="middle">manager AW/B/AR/R: metrics</text>

  <rect class="optional" x="862" y="238" width="270" height="99" rx="8"/>
  <text class="h" x="997" y="263" text-anchor="middle">Optional environment checkers</text>
  <text class="t" x="997" y="286" text-anchor="middle">reset checker · frequency checker</text>
  <text class="s" x="997" y="310" text-anchor="middle">created only when configured</text>
  <text class="s" x="997" y="327" text-anchor="middle">default: off</text>

  <path class="config" d="M830 164H862"/><path class="config" d="M830 188C875 215 887 215 913 206"/>
  <path class="ana" d="M250 337V382H845V151H862"/><path class="ana" d="M580 294H602V365H842V184H862"/>
  <path class="ana" d="M298 314V354H608V287H628"/><path class="ana" d="M580 315H610V305H628"/>

  <rect x="28" y="449" width="1144" height="42" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h" x="600" y="468" text-anchor="middle">HVL ↔ HDL boundary</text>
  <text class="t" x="600" y="484" text-anchor="middle">class transaction ↔ seq_item_converter ↔ BFM struct ↔ virtual interface task</text>

  <path class="ctrl" d="M173 337V449"/><path class="ctrl" d="M455 337V449"/>

  <rect class="panel" x="28" y="509" width="1144" height="218" rx="12"/>
  <text class="layer" x="46" y="534">HDL — top/hdl_top.sv</text>

  <rect class="control" x="48" y="558" width="190" height="116" rx="8"/>
  <text class="h" x="143" y="582" text-anchor="middle">Manager agent BFM ×N</text>
  <text class="t" x="143" y="605" text-anchor="middle">driver BFM</text>
  <text class="t" x="143" y="625" text-anchor="middle">monitor BFM</text>
  <text class="s" x="143" y="650" text-anchor="middle">standing B/R collectors</text>

  <rect class="pinbox" x="275" y="558" width="158" height="116" rx="8"/>
  <text class="h" x="354" y="582" text-anchor="middle">Manager axi4_if</text>
  <text class="t" x="354" y="606" text-anchor="middle">AW · W · B</text>
  <text class="t" x="354" y="627" text-anchor="middle">AR · R</text>
  <text class="s" x="354" y="650" text-anchor="middle">physical pins</text>

  <rect class="pinbox" x="472" y="558" width="245" height="116" rx="8"/>
  <text class="h" x="594" y="582" text-anchor="middle">Compile-time DUT choice</text>
  <rect x="490" y="600" width="98" height="50" rx="6" fill="#fff" stroke="#dc2626"/>
  <text class="t" x="539" y="620" text-anchor="middle">Direct 1:1</text><text class="s" x="539" y="638" text-anchor="middle">baseline</text>
  <rect x="600" y="600" width="99" height="50" rx="6" fill="#fff" stroke="#dc2626"/>
  <text class="t" x="649" y="620" text-anchor="middle">Fabric DUT</text><text class="s" x="649" y="638" text-anchor="middle">Track-B</text>

  <rect class="pinbox" x="756" y="558" width="158" height="116" rx="8"/>
  <text class="h" x="835" y="582" text-anchor="middle">Subordinate axi4_if</text>
  <text class="t" x="835" y="606" text-anchor="middle">AW · W · B</text>
  <text class="t" x="835" y="627" text-anchor="middle">AR · R</text>
  <text class="s" x="835" y="650" text-anchor="middle">physical pins</text>

  <rect class="control" x="952" y="558" width="190" height="116" rx="8"/>
  <text class="h" x="1047" y="582" text-anchor="middle">Subordinate agent BFM ×N</text>
  <text class="t" x="1047" y="605" text-anchor="middle">driver BFM</text>
  <text class="t" x="1047" y="625" text-anchor="middle">monitor BFM</text>
  <text class="s" x="1047" y="650" text-anchor="middle">reactive responder</text>

  <path class="pins" d="M238 616H275"/><path class="pins" d="M433 616H472"/><path class="pins" d="M717 616H756"/><path class="pins" d="M914 616H952"/>

  <rect class="optional" x="410" y="687" width="370" height="27" rx="5"/>
  <text class="t" x="595" y="705" text-anchor="middle">Bound SVA observes manager and subordinate pins</text>
</svg>
